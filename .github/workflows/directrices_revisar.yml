name: Directrices — revisar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar estado actual de la rama data
        run: |
          mkdir -p dashboard-data
          git fetch origin data
          git show origin/data:dashboard-data/directrices_estado.json > dashboard-data/directrices_estado.json 2>/dev/null \
            || echo '{"actualizado":"","directrices":[]}' > dashboard-data/directrices_estado.json

      - name: Materializar mapeo área→responsable (no se commitea)
        env:
          AREA_RESPONSABLES_JSON: ${{ secrets.AREA_RESPONSABLES_JSON }}
        run: echo "$AREA_RESPONSABLES_JSON" > area_responsables.json

      - name: Detectar directrices nuevas, revisar respuestas/reacciones y escalar si corresponde
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TEAMS_TEAM_ID:       ${{ secrets.TEAMS_TEAM_ID }}
          TEAMS_CHANNEL_ID:    ${{ secrets.TEAMS_CHANNEL_ID }}
        run: python directrices_revisar.py

      - name: Publicar estado en rama data
        run: |
          git config user.name  "hf-dashboard-bot"
          git config user.email "bot@healthyfood.com.ec"

          for intento in 1 2 3 4 5; do
            rm -rf /tmp/data-worktree
            git worktree prune
            git fetch origin data
            git worktree add /tmp/data-worktree origin/data

            mkdir -p /tmp/data-worktree/dashboard-data
            cp dashboard-data/directrices_estado.json /tmp/data-worktree/dashboard-data/

            cd /tmp/data-worktree
            git add dashboard-data/directrices_estado.json
            if git diff --staged --quiet; then
              echo "Sin cambios que publicar."
              exit 0
            fi
            git commit -m "directrices: revisión $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:data; then
              echo "Publicado."
              exit 0
            fi
            echo "Push rechazado (intento $intento), reintentando..."
            cd "$GITHUB_WORKSPACE"
            sleep $((intento * 5))
          done
          echo "No se pudo publicar tras varios intentos" >&2
          exit 1
