name: Extraer datos Odoo → CSV

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rama main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # necesario para acceder a todas las ramas

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar extractor
        env:
          ODOO_URL:  ${{ secrets.ODOO_URL }}
          ODOO_DB:   ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
        run: python odoo_to_csv.py

      - name: Publicar CSV en rama data (sin disparar Pages)
        run: |
          git config user.name  "hf-dashboard-bot"
          git config user.email "bot@healthyfood.com.ec"

          # Guardar CSVs ANTES de cambiar de rama
          cp -r dashboard-data /tmp/csv-backup

          # Cambiar a rama data (o crearla huérfana si no existe)
          if git ls-remote --exit-code origin data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # Restaurar CSVs en la rama data
          mkdir -p dashboard-data
          cp /tmp/csv-backup/* dashboard-data/

          # Commit y push
          git add dashboard-data/
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data
