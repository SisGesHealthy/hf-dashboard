name: Extraer datos Odoo → CSV

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:           # también se puede lanzar manualmente

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rama main (para obtener odoo_to_csv.py)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar extractor
        env:
          ODOO_URL:  ${{ secrets.ODOO_URL }}
          ODOO_DB:   ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
        run: python odoo_to_csv.py

      - name: Publicar CSV en rama data (sin disparar Pages)
        run: |
          git config user.name  "hf-dashboard-bot"
          git config user.email "bot@healthyfood.com.ec"

          # Cambiar a rama data (crearla si no existe)
          git fetch origin data 2>/dev/null || true
          git checkout -B data origin/data 2>/dev/null || git checkout --orphan data

          # Dejar solo la carpeta dashboard-data
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add dashboard-data/
          git diff --staged --quiet || git commit -m "data: actualizar CSV $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data
