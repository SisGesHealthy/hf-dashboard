<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taller — Healthy Food</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --verde:    #6a8f2f;
      --verde-c:  #8ab93f;
      --naranja:  #e07b2a;
      --azul:     #2a7be0;
      --gris:     #f5f5f5;
      --blanco:   #ffffff;
      --texto:    #2c2c2c;
      --vacio:    #bdbdbd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--gris);
      color: var(--texto);
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--verde);
      color: white;
      display: flex;
      align-items: center;
      padding: 7px 18px;
      gap: 14px;
      flex-shrink: 0;
    }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 1.15rem; font-weight: 700; }
    .header-title p  { font-size: .76rem; opacity: .85; }
    #reloj { font-size: .95rem; font-weight: 600; text-align: right; white-space: nowrap; }
    #reloj span { display: block; font-size: .68rem; font-weight: 400; opacity: .8; }
    .nav-link {
      color: white; opacity: .8; text-decoration: none;
      font-size: .8rem; border: 1px solid rgba(255,255,255,.4);
      padding: 4px 10px; border-radius: 5px; white-space: nowrap;
    }
    .nav-link:hover { opacity: 1; background: rgba(255,255,255,.15); }
    #fecha-selector {
      font-size: .8rem; padding: 4px 8px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15);
      color: white;
    }
    #fecha-selector::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    /* ── ÚLTIMA ACT ── */
    #ultima-act {
      text-align: right; padding: 2px 18px 0;
      font-size: .68rem; color: #888; flex-shrink: 0;
    }

    /* ── TARJETAS DE ÁREAS ── */
    .areas-wrap {
      padding: 6px 18px 0;
      flex-shrink: 0;
    }
    .areas-grid {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .area-card {
      background: var(--blanco);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      border-top: 4px solid var(--verde);
      padding: 8px 12px;
      min-width: 160px;
      flex: 1;
    }
    .area-card.vacia { border-top-color: var(--vacio); opacity: .6; }
    .area-card.alerta { border-top-color: var(--naranja); }
    .area-nombre {
      font-weight: 700; font-size: .82rem;
      margin-bottom: 5px; display: flex;
      align-items: center; gap: 5px;
    }
    .area-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--verde); flex-shrink: 0;
    }
    .area-card.vacia .area-dot { background: var(--vacio); }
    .area-card.alerta .area-dot { background: var(--naranja); }
    .empleado-chip {
      display: inline-block;
      background: #e8f5e9; color: #2e7d32;
      border-radius: 12px; padding: 2px 8px;
      font-size: .7rem; font-weight: 600;
      margin: 2px 2px 0 0;
    }
    .area-card.alerta .empleado-chip { background: #fff3e0; color: #e65100; }
    .area-vacia-txt { font-size: .72rem; color: var(--vacio); font-style: italic; }
    .area-ot { font-size: .68rem; color: #888; margin-top: 4px; }
    .area-bloque { margin-top: 4px; line-height: 1.4; }
    .area-ot-cod { font-size: .72rem; font-weight: 700; color: var(--verde); }
    .area-operac { font-size: .68rem; color: #666; }
    .area-producto { font-size: .7rem; color: #333; font-weight: 600; margin-top: 1px; }

    /* ── LEYENDA ÓRDENES ── */
    .leyenda-wrap {
      padding: 4px 18px 0;
      flex-shrink: 0;
    }
    .leyenda-grid {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .leyenda-chip {
      background: var(--blanco);
      border-radius: 6px;
      border-left: 6px solid var(--verde);
      padding: 5px 12px 5px 10px;
      font-size: .72rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      display: flex; align-items: center; gap: 8px;
    }
    .leyenda-color-dot {
      width: 14px; height: 14px; border-radius: 3px;
      flex-shrink: 0;
    }
    .leyenda-cod  { font-weight: 700; color: #333; white-space: nowrap; }
    .leyenda-prod { color: #555; }

    /* ── GANTT ── */
    .gantt-wrap {
      flex: 1; min-height: 0;
      padding: 6px 18px 6px;
      display: flex;
      flex-direction: column;
    }
    .gantt-titulo {
      font-size: .8rem; font-weight: 700; color: var(--verde);
      margin-bottom: 4px; flex-shrink: 0;
    }
    #gantt-header-wrap { flex-shrink: 0; overflow: hidden; }
    #gantt-header-wrap table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .gantt-scroll { flex: 1; overflow: hidden; position: relative; }
    #scroll-gantt { display: block; }
    #scroll-gantt:hover { animation-play-state: paused; }
    @keyframes scrollUpGantt {
      0%   { transform: translateY(0); }
      100% { transform: translateY(var(--gantt-dist, -50%)); }
    }
    .gantt-tabla { width: 100%; border-collapse: collapse; }

    /* cabecera horas */
    .gantt-tabla thead th {
      font-size: .68rem; color: #888; font-weight: 600;
      padding: 3px 0; text-align: center;
      border-bottom: 2px solid #e0e0e0;
      white-space: nowrap;
    }
    .gantt-tabla thead th.col-nombre {
      text-align: left; padding-left: 8px; width: 160px; color: var(--verde);
    }

    /* filas empleado */
    .gantt-tabla tbody tr { height: 34px; }
    .gantt-tabla tbody tr:nth-child(even) { background: #f5f5f5; }
    .col-nombre-cell {
      font-size: .78rem; font-weight: 600;
      padding: 0 8px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      max-width: 160px; color: var(--texto);
      border-right: 2px solid #e0e0e0;
    }
    .gantt-timeline {
      position: relative; height: 30px;
    }
    .gantt-bar {
      position: absolute;
      height: 22px; top: 4px;
      border-radius: 5px;
      display: flex; align-items: center;
      padding: 0 7px; overflow: hidden;
      font-size: .65rem; font-weight: 700;
      color: white; white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
      gap: 5px;
    }
    .gantt-bar .bar-ot  { opacity: 1; }
    .gantt-bar .bar-op  { opacity: .85; font-weight: 400; font-size: .6rem; }
    .gantt-hora-actual {
      position: absolute; top: 0; bottom: 0;
      width: 2px; background: #e53935; opacity: .8;
      z-index: 10;
    }
    .gantt-hora-actual::after {
      content: '▼'; position: absolute; top: -10px;
      left: -5px; font-size: .65rem; color: #e53935;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 3px;
      font-size: .62rem; color: #bbb; flex-shrink: 0;
    }

    /* colores por área */
    .color-0  { background: #6a8f2f; }
    .color-1  { background: #2a7be0; }
    .color-2  { background: #e07b2a; }
    .color-3  { background: #8e24aa; }
    .color-4  { background: #00838f; }
    .color-5  { background: #c62828; }
    .color-6  { background: #2e7d32; }
    .color-7  { background: #4527a0; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-title">
    <h1>🏭 Control de Taller</h1>
    <p>Healthy Food Marcalman Ecuador S.A.</p>
  </div>
  <a href="index.html" class="nav-link">📊 Dashboard operativo</a>
  <a href="calidad-sp.html" class="nav-link">🚛 Flujo Operativo</a>
  <a href="calidad.html" class="nav-link">🔬 Control Calidad</a>
  <input type="date" id="fecha-selector" title="Ver otro día (semana en curso)">
  <div id="reloj">
    <span id="fecha-hoy"></span>
    <span id="hora-ahora"></span>
  </div>
</header>

<div id="ultima-act">Cargando...</div>

<!-- TARJETAS ÁREAS -->
<div class="areas-wrap">
  <div class="areas-grid" id="areas-grid">
    <div style="color:#999;padding:10px">Cargando áreas...</div>
  </div>
</div>

<!-- LEYENDA ÓRDENES -->
<div class="leyenda-wrap">
  <div class="leyenda-grid" id="leyenda-grid"></div>
</div>

<!-- GANTT -->
<div class="gantt-wrap">
  <div class="gantt-titulo" id="gantt-titulo">⏱ Actividad de empleados hoy</div>
  <!-- Cabecera fija (horas) -->
  <div id="gantt-header-wrap"></div>
  <!-- Cuerpo con scroll -->
  <div class="gantt-scroll">
    <div id="scroll-gantt">
      <table class="gantt-tabla" id="gantt-tabla">
        <tbody><tr><td style="color:#999;padding:10px">Cargando Gantt...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<footer>Actualización automática · Datos desde Odoo · Healthy Food © 2026</footer>

<script>
const REPO   = 'SisGesHealthy/hf-dashboard';
const BRANCH = 'data';

// ── Reloj ──────────────────────────────────────────────────────────────────
function actualizarReloj() {
  const a = new Date();
  const dias  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('fecha-hoy').textContent =
    `${dias[a.getDay()]}, ${a.getDate()} de ${meses[a.getMonth()]} de ${a.getFullYear()}`;
  document.getElementById('hora-ahora').textContent =
    a.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

function hoyStr() {
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
}

function lunesActualStr() {
  const h = new Date();
  const dow = (h.getDay() + 6) % 7; // 0 = lunes
  const lunes = new Date(h);
  lunes.setDate(h.getDate() - dow);
  return `${lunes.getFullYear()}-${String(lunes.getMonth()+1).padStart(2,'0')}-${String(lunes.getDate()).padStart(2,'0')}`;
}

async function leerCSV(nombre, fecha) {
  const esHoy = fecha === hoyStr();
  const ruta  = esHoy ? nombre : `historico/${fecha}/${nombre}`;
  const url   = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/dashboard-data/${ruta}?t=${Date.now()}`;
  const res   = await fetch(url, { cache: 'no-store' });
  if (!res.ok) return null;
  const txt   = await res.text();
  return new Promise(r => Papa.parse(txt, { header:true, skipEmptyLines:true, complete: d => r(d.data) }));
}

// Paleta de colores por área
const PALETA = ['color-0','color-1','color-2','color-3','color-4','color-5','color-6','color-7'];
const colorArea = {};
let colorIdx = 0;
function getColorArea(area) {
  if (!colorArea[area]) colorArea[area] = PALETA[colorIdx++ % PALETA.length];
  return colorArea[area];
}

// ── TARJETAS DE ÁREAS (solo áreas con empleado activo AHORA) ──────────────
function renderAreas(filas, prodIdx) {
  const areas = {};

  filas.forEach(f => {
    if (!f.empleado || f.empleado === 'Sin registro hoy') return;
    const finStr  = (f.emp_fecha_fin || '').trim().toLowerCase();
    const enCurso = (f.estado_ot || '').toLowerCase().includes('progreso')
                 && f.emp_fecha_inicio && f.emp_fecha_inicio.trim() !== ''
                 && (finStr === '' || finStr.includes('curso'));
    if (!enCurso) return;

    const area = f.centro_trabajo || 'Sin área';
    if (!areas[area]) areas[area] = { empleados: new Set(), bloques: [] };
    areas[area].empleados.add(f.empleado);

    if (f.orden_trabajo) {
      const partes  = f.orden_trabajo.split(' - ');
      const otCod   = partes[0].trim();
      const operac  = partes[1] ? partes[1].trim() : '';
      const producto = (prodIdx && prodIdx[otCod]) || '';
      const key = otCod + '|' + operac;
      if (!areas[area].bloques.find(b => b.key === key)) {
        areas[area].bloques.push({ key, otCod, operac, producto });
      }
    }
  });

  const grid = document.getElementById('areas-grid');
  if (!Object.keys(areas).length) {
    grid.innerHTML = '<div style="color:#999;font-style:italic;padding:8px">Sin áreas activas en este momento</div>';
    return;
  }

  grid.innerHTML = Object.entries(areas)
    .sort((a, b) => b[1].empleados.size - a[1].empleados.size)
    .map(([nombre, data]) => {
      const emps = [...data.empleados].map(e =>
        `<span class="empleado-chip">${e.split(' ').slice(0,2).join(' ')}</span>`
      ).join('');
      const bloques = data.bloques.slice(0,2).map(b => `
        <div class="area-bloque">
          <span class="area-ot-cod">${b.otCod}</span>
          ${b.operac ? `<span class="area-operac"> · ${b.operac}</span>` : ''}
          ${b.producto ? `<div class="area-producto">📦 ${b.producto}</div>` : ''}
        </div>`).join('');
      return `
        <div class="area-card">
          <div class="area-nombre"><div class="area-dot"></div>${nombre}</div>
          <div style="margin:3px 0">${emps}</div>
          ${bloques}
        </div>`;
    }).join('');
}

// ── LEYENDA ÓRDENES ACTIVAS ───────────────────────────────────────────────
function renderLeyenda(filas, prodIdx) {
  const vistas = {};
  // Solo OTs En Progreso que tienen actividad de empleados en el día mostrado
  filas.forEach(f => {
    if (!f.orden_trabajo) return;
    if (!(f.estado_ot || '').toLowerCase().includes('progreso')) return;
    if (!f.empleado || f.empleado === 'Sin registro hoy') return;
    if (!f.emp_fecha_inicio || !f.emp_fecha_inicio.trim()) return;
    const otCod = f.orden_trabajo.split(' - ')[0].trim();
    if (!vistas[otCod]) vistas[otCod] = prodIdx[otCod] || '';
  });
  const grid = document.getElementById('leyenda-grid');
  const COLORES = {'color-0':'#6a8f2f','color-1':'#2a7be0','color-2':'#e07b2a',
                   'color-3':'#8e24aa','color-4':'#00838f','color-5':'#c62828',
                   'color-6':'#2e7d32','color-7':'#4527a0'};
  grid.innerHTML = Object.entries(vistas).map(([cod, prod]) => {
    const colorCls = getColorArea(cod);
    const hex = COLORES[colorCls] || '#6a8f2f';
    return `<div class="leyenda-chip" style="border-left-color:${hex}">
      <div class="leyenda-color-dot" style="background:${hex}"></div>
      <span class="leyenda-cod">${cod}</span>
      ${prod ? `<span class="leyenda-prod">${prod}</span>` : ''}
    </div>`;
  }).join('');
}

// ── GANTT ─────────────────────────────────────────────────────────────────
function renderGantt(filas, prodIdx, esHoy) {
  const HORA_INI = 6;   // 06:00
  const HORA_FIN = 24;  // 00:00 (medianoche)
  const TOTAL_H  = HORA_FIN - HORA_INI;

  // Hoy: solo OT activas (En progreso). Días pasados: todo registro con inicio.
  // Acepta emp_fecha_inicio (productividad) o ot_fecha_inicio (OT editada manualmente).
  const tieneInicio = f =>
    (f.emp_fecha_inicio && f.emp_fecha_inicio.trim()) ||
    (f.ot_fecha_inicio  && f.ot_fecha_inicio.trim());

  const activos = filas.filter(f => {
    if (!f.empleado || f.empleado === 'Sin registro hoy') return false;
    if (!tieneInicio(f)) return false;
    if (esHoy) return (f.estado_ot || '').toLowerCase().includes('progreso');
    return true;
  });

  if (!activos.length) {
    document.getElementById('gantt-tabla').innerHTML =
      '<tbody><tr><td style="color:#999;padding:10px;font-style:italic">Sin registros de empleados para este día</td></tr></tbody>';
    return;
  }

  // Agrupar por empleado → lista de bloques
  const porEmpleado = {};
  activos.forEach(f => {
    const emp = f.empleado;
    if (!porEmpleado[emp]) porEmpleado[emp] = [];
    porEmpleado[emp].push(f);
  });

  // Horas del header
  const horas = [];
  for (let h = HORA_INI; h <= HORA_FIN; h++) horas.push(h);

  // Posición % dentro del rango (hora 0 = medianoche = 24)
  function pct(fechaStr) {
    if (!fechaStr || !fechaStr.trim()) return null;
    const partes = fechaStr.trim().split(' ');
    if (!partes[1]) return null;
    let [hh, mm] = partes[1].split(':').map(Number);
    if (hh === 0) hh = 24; // medianoche = fin de jornada
    const totalMin = (hh - HORA_INI) * 60 + mm;
    return Math.min(100, Math.max(0, (totalMin / (TOTAL_H * 60)) * 100));
  }

  // Hora actual
  const ahora = new Date();
  const pctAhora = pct(
    `hoy ${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')}:00`
  );
  const pctAhoraReal = Math.min(100, Math.max(0,
    ((ahora.getHours() - HORA_INI) * 60 + ahora.getMinutes()) / (TOTAL_H * 60) * 100
  ));

  // colgroup compartido para alinear header y body
  const colgroup = `<colgroup>
    <col style="width:160px">
    <col>
  </colgroup>`;

  // ── Cabecera fija (fuera del scroll) ──
  const theadHtml = `<table class="gantt-tabla" style="table-layout:fixed">
    ${colgroup}
    <thead><tr>
      <th class="col-nombre">Empleado</th>
      <th style="padding:0;position:relative">
        <div style="position:relative;height:20px">
          ${horas.map(h => {
            const pctH = ((h - HORA_INI) / TOTAL_H * 100).toFixed(2);
            return `<span style="position:absolute;left:${pctH}%;font-size:.65rem;color:#888;transform:translateX(-50%)">${h === 24 ? '00:00' : String(h).padStart(2,'0') + ':00'}</span>`;
          }).join('')}
        </div>
      </th>
    </tr></thead>
  </table>`;
  document.getElementById('gantt-header-wrap').innerHTML = theadHtml;

  // ── Cuerpo (en el scroller) ──
  let tbody = '<tbody>';
  Object.entries(porEmpleado).forEach(([emp, bloques]) => {
    const bars = bloques.map(b => {
      // Si hay registro de empleado (productividad): usar emp_fecha_inicio/fin.
      //   "En curso" → barra se extiende hasta ahora, nunca cae a ot_fecha_fin.
      // Si NO hay registro de empleado: fallback a tiempos de la OT (editados en Odoo).
      const hasEmp = b.emp_fecha_inicio && b.emp_fecha_inicio.trim();
      const iniStr = hasEmp ? b.emp_fecha_inicio : (b.ot_fecha_inicio || '');
      const fuente = hasEmp ? '' : ' [OT]';

      const ini = pct(iniStr);
      let fin;
      if (hasEmp) {
        const empFin = (b.emp_fecha_fin || '').trim();
        if (empFin && !empFin.toLowerCase().includes('curso')) fin = pct(empFin);
        else fin = esHoy ? pctAhoraReal : 100;
      } else {
        const otFin = (b.ot_fecha_fin || '').trim();
        if (otFin) fin = pct(otFin);
        else fin = esHoy ? pctAhoraReal : 100;
      }
      if (ini === null || fin === null || fin <= ini) return '';
      const left  = ini.toFixed(2);
      const width = Math.max(0.5, fin - ini).toFixed(2);
      const ot    = (b.orden_trabajo || '').split(' - ')[0].trim();
      const op    = (b.orden_trabajo || '').split(' - ')[1]?.trim() || ot;
      const colorCls = getColorArea(ot);
      return `<div class="gantt-bar ${colorCls}" style="left:${left}%;width:${width}%" title="${ot} · ${op}${fuente}">
        <span style="font-size:.63rem">${op}${fuente}</span>
      </div>`;
    }).join('');

    tbody += `<tr>
      <td class="col-nombre-cell" title="${emp}">${emp.split(' ').slice(0,2).join(' ')}</td>
      <td style="padding:0;position:relative">
        <div class="gantt-timeline">
          ${esHoy ? `<div class="gantt-hora-actual" style="left:${pctAhoraReal.toFixed(2)}%"></div>` : ''}
          ${bars}
        </div>
      </td>
    </tr>`;
  });
  tbody += '</tbody>';

  document.getElementById('gantt-tabla').outerHTML =
    `<table class="gantt-tabla" id="gantt-tabla" style="table-layout:fixed">${colgroup}${tbody}</table>`;
}

// ── Carga principal ────────────────────────────────────────────────────────
async function cargarDatos() {
  try {
    const fechaSel = document.getElementById('fecha-selector').value || hoyStr();
    const esHoy    = fechaSel === hoyStr();

    document.getElementById('ultima-act').textContent = 'Actualizando...';
    const [taller, produccion] = await Promise.all([
      leerCSV('taller.csv', fechaSel),
      leerCSV('produccion.csv', fechaSel),
    ]);

    if (!esHoy && (taller === null || produccion === null)) {
      document.getElementById('areas-grid').innerHTML =
        '<div style="color:#999;font-style:italic;padding:8px">Sin datos guardados para esta fecha</div>';
      document.getElementById('leyenda-grid').innerHTML = '';
      document.getElementById('gantt-titulo').textContent = `⏱ Actividad de empleados — ${fechaSel}`;
      document.getElementById('gantt-tabla').innerHTML =
        '<tbody><tr><td style="color:#999;padding:10px;font-style:italic">Aún no hay datos guardados para esta fecha</td></tr></tbody>';
      document.getElementById('ultima-act').textContent =
        `Sin datos históricos guardados aún para ${fechaSel} (disponibles desde la próxima actualización, cada 30 min)`;
      return;
    }

    const filas = taller.filter(f => (f.fecha || '').startsWith(fechaSel));

    // Índice orden → producto (desde produccion.csv)
    const prodIdx = {};
    produccion.forEach(p => {
      if (p.orden_produccion) prodIdx[p.orden_produccion.trim()] = p.producto || '';
    });

    if (esHoy) {
      renderAreas(filas, prodIdx);
      renderLeyenda(filas, prodIdx);
    } else {
      document.getElementById('areas-grid').innerHTML =
        '<div style="color:#999;font-style:italic;padding:8px">Vista histórica — sin panel de personal activo</div>';
      document.getElementById('leyenda-grid').innerHTML = '';
    }

    document.getElementById('gantt-titulo').textContent =
      esHoy ? '⏱ Actividad de empleados hoy' : `⏱ Actividad de empleados — ${fechaSel}`;

    // reset gantt scroll antes de re-renderizar
    const sg = document.getElementById('scroll-gantt');
    if (sg) { while (sg.children.length > 1) sg.removeChild(sg.lastChild); sg.dataset.doubled = ''; sg.style.animation = 'none'; sg.style.transform = 'translateY(0)'; }

    renderGantt(filas, prodIdx, esHoy);
    setTimeout(ajustarScrollGantt, 150);

    const ahora = new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('ultima-act').textContent = esHoy
      ? `Última actualización: ${ahora} · próxima en ~30 min`
      : `Vista histórica del ${fechaSel}`;
  } catch(e) {
    document.getElementById('ultima-act').textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

// ── Auto-scroll Gantt ─────────────────────────────────────────────────────
function ajustarScrollGantt() {
  const scroller = document.getElementById('scroll-gantt');
  if (!scroller) return;
  const wrap   = scroller.closest('.gantt-scroll');
  const wrapH  = wrap ? wrap.clientHeight : 0;
  const tableH = scroller.querySelector('table')?.offsetHeight || 0;

  if (tableH <= wrapH) { scroller.style.animation = 'none'; return; }

  if (!scroller.dataset.doubled) {
    const tbl   = scroller.querySelector('table');
    const clone = tbl.cloneNode(true);
    scroller.appendChild(clone);
    scroller.dataset.doubled = '1';
  }
  const dur = Math.max(14, tableH / 24) + 's';
  scroller.style.setProperty('--gantt-dist', '-' + tableH + 'px');
  scroller.style.animation = `scrollUpGantt ${dur} linear infinite`;
}

// ── Selector de fecha (semana en curso, default hoy) ───────────────────────
const selFecha = document.getElementById('fecha-selector');
selFecha.value = hoyStr();
selFecha.min   = lunesActualStr();
selFecha.max   = hoyStr();
selFecha.addEventListener('change', cargarDatos);

// Cargar al inicio y refrescar en :05 y :35 de cada hora
cargarDatos();
function programarSiguienteActualizacion() {
  const ahora = new Date();
  const min = ahora.getMinutes(), seg = ahora.getSeconds(), ms = ahora.getMilliseconds();
  let t;
  if (min < 5)       t = 5;
  else if (min < 35) t = 35;
  else               t = 65;
  setTimeout(() => { cargarDatos(); programarSiguienteActualizacion(); },
    ((t - min) * 60 - seg) * 1000 - ms);
}
programarSiguienteActualizacion();

// ── Rotación automática → Calidad (60 s) ─────────────────────────────────
setTimeout(() => { window.location.href = 'calidad-sp.html'; }, 60000);
